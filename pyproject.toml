[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aw1-circuit-breaker"
version = "0.1.1"
description = "Deterministic sub-0.2ms AST execution circuit breaker for autonomous agents and MCP servers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mvik Manners" }
]
classifiers = [
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "mcp>=1.0.0"
]

[project.scripts]
aw1 = "aw1.cli:main"
aw1-circuit-breaker = "aw1.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aw1"]
