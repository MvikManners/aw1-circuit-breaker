[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aw1-breaker"
version = "0.1.1"
authors = [
  { name="Manners Vela Ikhutseng", email="dev@laveto.net" },
]
description = "Deterministic, sub-millisecond execution circuit breaker for autonomous AI agent tool-calls."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
"Homepage" = "https://github.com/MvikManners/aw1-circuit-breaker"
"Bug Tracker" = "https://github.com/MvikManners/aw1-circuit-breaker/issues"
