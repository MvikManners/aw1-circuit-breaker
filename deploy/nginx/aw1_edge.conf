# =====================================================================
# AW-1 & Laveto Wisdom Production Edge Reverse Proxy (Nginx)
# Hardened Layer-7 Perimeter, Rate Limiting, and TLS 1.3 Termination
# =====================================================================

# Rate Limiting Zones (10MB memory zone holds ~160,000 IP/Key states)
limit_req_zone $binary_remote_addr zone=aw1_ip_limit:10m rate=50r/s;
limit_req_zone $http_x_api_key zone=aw1_key_limit:10m rate=100r/s;
limit_req_status 429;

# Upstream WSGI Cluster (Keepalive connection pool)
upstream aw1_gunicorn_cluster {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME Challenge for Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Hardened Edge Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # SSL / TLS 1.3 Modern Configuration
    ssl_certificate /etc/ssl/certs/aw1_gateway.crt;
    ssl_certificate_key /etc/ssl/private/aw1_gateway.key;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:AW1_SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Edge Buffer & Payload Limits (Drops oversized attacks before hitting Python)
    client_max_body_size 1M;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Anti-Slowloris Mitigations
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    send_timeout 10s;

    # Security & Anti-Clickjacking Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

    # Real Client IP Resolution
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Root Route & Static Assets
    location / {
        limit_req zone=aw1_ip_limit burst=20 nodelay;

        proxy_pass http://aw1_gunicorn_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Dedicated Interception Boundary: High-Priority Circuit Breaker API
    location ~* ^/(wisdom/api/v1/aw/audit|wisdom/v1/aw/audit|v1/aw/audit) {
        # Strict API-Key Rate Limiting with fallback to IP limit
        limit_req zone=aw1_key_limit burst=40 nodelay;
        limit_req zone=aw1_ip_limit burst=20 nodelay;

        proxy_pass http://aw1_gunicorn_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Fast Out-of-Band SLA: fail-closed if circuit breaker takes > 5s
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;

        # Disable disk buffering for microsecond audit streams
        proxy_buffering off;
    }
}
