name: HOL Guard Security CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  hol-guard-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install hol-guard
        run: pip install hol-guard
      - name: Run HOL Guard Plugin Check
        run: hol-guard plugin check .
