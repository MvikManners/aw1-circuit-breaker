name: TDQS Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  tdqs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run Deterministic TDQS Lint
        run: npx -y mcp-tdqs@latest lint --url "https://p20.laveto.net/wisdom/mcp" --fail-on error
