name: HOL Plugin Scanner CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scan-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: AI plugin quality gate
        uses: hashgraph-online/ai-plugin-scanner-action@9b169fc65d09b24726b66d70b3563ab563158b58
        continue-on-error: true
        with:
          plugin_dir: "."
          config: ".plugin-scanner.toml"
          min_score: 75
          fail_on_severity: critical
