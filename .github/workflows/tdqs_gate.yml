name: TDQS Compliance Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  evaluate-tdqs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run TDQS Quality Lint
        run: |
          npx -y mcp-tdqs lint --url "https://p20.laveto.net/wisdom/mcp" --fail-on error
