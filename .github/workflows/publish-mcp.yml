name: Publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Grants GitHub OIDC token to verify ownership of io.github.mvikmanners

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.23'

      - name: Install mcp-publisher
        run: |
          go install github.com/modelcontextprotocol/registry/cmd/publisher@latest

      - name: Publish to MCP Registry
        run: |
          publisher publish --manifest server.json
