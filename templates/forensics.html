<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORENSIC VAULT // {{ vin }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --integrity-gold: #9c8052;
            --sanctified-blue: #00447c;
            --vault-black: #0a0a0b;
        }

        body {
            background-color: var(--vault-black);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- VAULT HEADER --- */
        .vault-header {
            padding: 60px 5% 40px;
            text-align: center;
            border-bottom: 1px solid #222;
            background: radial-gradient(circle at top, #1a1a1c 0%, var(--vault-black) 100%);
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            letter-spacing: 5px;
            color: #fff;
            margin: 0;
            font-size: 2rem;
            text-transform: uppercase;
        }

        .vin-badge {
            display: inline-block;
            margin-top: 15px;
            font-family: 'Courier Prime', monospace;
            color: var(--integrity-gold);
            font-size: 1.2rem;
            border: 1px solid var(--integrity-gold);
            padding: 8px 20px;
            border-radius: 4px;
            background: rgba(156, 128, 82, 0.05);
        }

        /* --- GALLERY ENGINE --- */
        .evidence-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            padding: 60px 5%;
            max-width: 1400px;
            margin: 0 auto;
            flex-grow: 1;
        }

        .evidence-card {
            background: #111113;
            border: 1px solid #222;
            border-radius: 4px;
            overflow: hidden;
            transition: 0.3s;
            position: relative;
        }

        .evidence-card:hover {
            border-color: var(--integrity-gold);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .evidence-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            filter: grayscale(20%);
            transition: 0.5s;
        }

        .evidence-card:hover img {
            filter: grayscale(0%);
        }

        .evidence-label {
            padding: 15px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            background: #111;
            border-top: 1px solid #222;
        }

        /* --- NAVIGATION --- */
        .vault-footer {
            padding: 60px 5%;
            text-align: center;
        }

        .btn-return {
            color: #fff;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 15px 40px;
            border: 1px solid #444;
            border-radius: 4px;
            transition: 0.3s;
        }

        .btn-return:hover {
            border-color: var(--integrity-gold);
            color: var(--integrity-gold);
            background: rgba(156, 128, 82, 0.1);
        }

        .no-data {
            grid-column: 1/-1;
            padding: 100px 0;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <header class="vault-header">
        <h1>Forensic Evidence Vault</h1>
        <div class="vin-badge">NODE ID: {{ vin }}</div>
    </header>

    <main class="evidence-grid">
        {% for photo in photos %}
        <div class="evidence-card">
            <img src="{{ url_for('static', filename='uploads/' + photo) }}" alt="Asset Evidence">
            <div class="evidence-label">
                <span style="color: var(--integrity-gold);">● Verified Log</span> | {{ photo }}
            </div>
        </div>
        {% else %}
        <div class="no-data">
            <p>Vault Empty // No Forensic Media Manifested for this Asset</p>
        </div>
        {% endfor %}
    </main>

    <footer class="vault-footer">
        <a href="{{ url_for('registry') }}" class="btn-return">← Back to Registry</a>
    </footer>

</body>
</html>
