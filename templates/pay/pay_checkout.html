<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laveto Pay — Instant Local Mobile Money Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full shadow-2xl">
        <div class="flex items-center space-x-3 mb-6">
            <span class="text-3xl">💳</span>
            <div>
                <h1 class="font-bold text-xl text-white">Laveto Pay</h1>
                <p class="text-xs text-slate-400">Secure Direct Settlement (BWP)</p>
            </div>
        </div>
        <div class="bg-slate-950 p-4 rounded-xl mb-6 border border-slate-800">
            <div class="flex justify-between text-sm mb-2">
                <span class="text-slate-400">Merchant:</span>
                <span class="font-semibold text-white">P20 Village Store</span>
            </div>
            <div class="flex justify-between text-sm mb-2">
                <span class="text-slate-400">Transaction Ref:</span>
                <span class="font-mono text-sky-400">TX-LVT-9941</span>
            </div>
            <div class="flex justify-between text-lg font-bold border-t border-slate-800 pt-2 mt-2">
                <span>Total Amount:</span>
                <span class="text-emerald-400">BWP 250.00</span>
            </div>
        </div>
        <div class="space-y-3">
            <button class="w-full bg-orange-600 hover:bg-orange-500 font-bold py-3 rounded-xl transition flex items-center justify-center space-x-2">
                <span>Orange Money (BWP)</span>
            </button>
            <button class="w-full bg-yellow-600 hover:bg-yellow-500 font-bold py-3 rounded-xl transition flex items-center justify-center space-x-2">
                <span>Mascom MyZaka</span>
            </button>
            <button class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded-xl transition flex items-center justify-center space-x-2">
                <span>BTC Smega / EFT</span>
            </button>
        </div>
    </div>
</body>
</html>
