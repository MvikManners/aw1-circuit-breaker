{% extends "base.html" %}
{% block content %}
<style>
    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        width: 100%;
        background-color: #0a0a0a;
    }
    .warden-container { background: #121212; padding: 40px; border-radius: 4px; box-shadow: 0 4px 25px rgba(0,0,0,0.5); width: 100%; max-width: 420px; text-align: center; border-top: 3px solid #d4af37; border: 1px solid #222; }
    h2 { color: #ffffff; font-size: 1.6rem; margin-bottom: 5px; font-family: monospace; font-weight: bold; letter-spacing: 2px; }
    p.subtitle { color: #d4af37; font-family: monospace; font-size: 0.85rem; letter-spacing: 1px; margin-bottom: 30px; text-transform: uppercase; }
    .form-group { text-align: left; margin-bottom: 20px; }
    label { font-size: 0.75rem; color: #888; font-family: monospace; font-weight: 600; text-transform: uppercase; display: block; margin-bottom: 8px; letter-spacing: 1px; }
    .input-box { width: 100%; padding: 14px 15px; background: #000; border: 1px solid #333; border-radius: 2px; box-sizing: border-box; font-size: 1rem; color: #fff; font-family: monospace; text-align: center; letter-spacing: 1px; }
    .input-box:focus { border-color: #d4af37; outline: none; box-shadow: 0 0 8px rgba(212, 175, 55, 0.2); }
    .btn-login { background: #0056b3; color: white; border: none; width: 100%; padding: 14px; font-size: 1rem; font-weight: bold; font-family: monospace; text-transform: uppercase; border-radius: 4px; cursor: pointer; transition: 0.2s; margin-top: 10px; letter-spacing: 1px; }
    .btn-login:hover { background: #004085; }
    .back-link { display: block; margin-top: 25px; font-size: 0.75rem; color: #555; text-decoration: none; font-family: monospace; text-transform: uppercase; letter-spacing: 1px; }
    .back-link:hover { color: #fff; }
</style>

<div class="login-wrapper">
    <div class="warden-container">
        <h2>GOSPEL OS</h2>
        <p class="subtitle">Field Agent Uplink</p>

        <form method="POST" action="{{ url_for('auth.warden_login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="warden_id">Agent ID Designation</label>
                <input type="text" name="warden_id" id="warden_id" class="input-box" placeholder="E.G. WARDEN-01" required>
            </div>

            <div class="form-group">
                <label for="password">Cryptographic Key</label>
                <input type="password" name="password" id="password" class="input-box" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">ESTABLISH UPLINK</button>
        </form>

        <a href="{{ url_for('auth.login') }}" class="back-link">Standard Staff Portal</a>
    </div>
</div>
{% endblock %}
