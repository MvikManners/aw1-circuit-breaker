<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Payroll Mandate | Admin Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime&family=Montserrat:wght@400;700;900&display=swap');
        
        body { 
            background-color: #050505; 
            color: #f0f6fc; 
            font-family: 'Courier Prime', monospace; 
        }
        .font-montserrat { font-family: 'Montserrat', sans-serif; }
        
        /* Custom Scrollbar for the dark theme */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #c5a059; }

        .live-dot {
            display: inline-block; width: 8px; height: 8px; background: #00ff88;
            border-radius: 50%; margin-right: 8px; box-shadow: 0 0 8px #00ff88;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0% { opacity: 0.5; }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body class="p-4 md:p-10 max-w-7xl mx-auto">

    <!-- Global CSRF Token for our AJAX Posts -->
    <input type="hidden" id="csrf_token" value="{{ csrf_token() }}">

    <!-- 🧲 HEADER -->
    <header class="border-b border-gray-800 pb-6 mb-8 flex flex-col md:flex-row justify-between md:items-end gap-4">
        <div>
            <span class="text-xs text-gray-500 uppercase tracking-[3px] font-bold flex items-center">
                <span class="live-dot"></span> LIVE UPLINK: ACCOUNTANT GENERAL
            </span>
            <h1 class="text-2xl md:text-3xl font-montserrat font-black uppercase tracking-widest text-[#c5a059] mt-2">
                Forge Payroll Mandate
            </h1>
            <p class="text-xs text-gray-400 mt-2 font-montserrat tracking-widest">Pending Client Authorizations Awaiting Admin Verification</p>
        </div>
        <div class="text-right bg-[#111111] border border-gray-800 p-4 rounded shadow-lg min-w-[250px]">
            <div class="text-xs text-gray-500 uppercase tracking-widest mb-1">System Pulse Calibration</div>
            <div id="grand-total-display" class="text-2xl text-[#00ff88] font-bold tracking-tighter">
                P0.00
            </div>
        </div>
    </header>

    <!-- 📊 COHORT MATRIX GRID (Injected by JS) -->
    <div id="cohort-matrix-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
        <!-- Initial Loading State -->
        <div class="col-span-full text-center p-12 border border-dashed border-gray-800 text-gray-500 rounded">
            <span class="text-2xl mb-4 block animate-spin">⚙️</span>
            [ SYNCHRONIZING LEDGER... ]
        </div>
    </div>

    <!-- 🚀 FOOTER CONTROLS -->
    <footer class="border-t border-gray-800 pt-6 flex flex-col md:flex-row justify-between items-center gap-4">
        <a href="{{ url_for('hangar.index') }}" class="text-gray-500 hover:text-[#c5a059] transition uppercase text-xs font-bold tracking-[2px] border border-gray-800 px-6 py-3 rounded hover:bg-white/5">
            ⬅ Return to Matrix
        </a>
        
        <button onclick="exportBatchCSV()" class="bg-[#0033a0] text-white px-8 py-3 font-montserrat font-black uppercase tracking-[2px] text-sm hover:bg-blue-800 transition shadow-[0_0_20px_rgba(0,51,160,0.4)] rounded">
            📥 EXECUTE MANDATE RUN
        </button>
    </footer>

    <script>
        // 1. Core Fetch Engine
        function loadMatrixData() {
            fetch("{{ url_for('hangar.api_pending_mandates') if url_for else '/hangar/api/pending_mandates' }}")
                .then(response => response.json())
                .then(data => {
                    renderDashboard(data);
                })
                .catch(err => console.error("Pulse monitoring error: ", err));
        }

        // 2. Rendering Engine
        function renderDashboard(data) {
            const grid = document.getElementById('cohort-matrix-grid');
            const totalDisplay = document.getElementById('grand-total-display');
            
            // Update Grand Total
            totalDisplay.innerText = `P${data.grand_total.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            
            const cohorts = data.cohorts;
            
            // Handle Empty State
            if (Object.keys(cohorts).length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center p-12 border border-dashed border-gray-800 text-gray-500 rounded">
                        <span class="text-2xl mb-4 block">📭</span>
                        [ NO PENDING MANDATES IN QUEUE ]
                    </div>
                `;
                return;
            }

            // Build Matrix
            let newHtml = '';
            for (const [cohortName, info] of Object.entries(cohorts)) {
                
                let membersHtml = '';
                info.members.forEach(m => {
                    const safeVin = m.vin ? m.vin.slice(-6) : 'UNKNOWN';
                    membersHtml += `
                        <div class="flex justify-between items-center border-b border-gray-900 pb-2 p-2 rounded transition hover:bg-white/5">
                            <div class="flex-grow">
                                <span class="text-gray-300 font-bold">${m.name}</span> 
                                <span class="text-[10px] text-gray-600 tracking-widest ml-1">[...${safeVin}]</span>
                            </div>
                            <div class="flex items-center gap-4">
                                <span class="text-[#00ff88] font-bold">P${m.total_due.toLocaleString(undefined, {minimumFractionDigits: 2})}</span>
                                <button onclick="verifyMandate(${m.id})" class="text-[10px] bg-blue-900/30 text-blue-400 border border-blue-800 px-3 py-1 rounded uppercase font-bold hover:bg-blue-600 hover:text-white hover:border-blue-400 cursor-pointer transition">
                                    Verify
                                </button>
                            </div>
                        </div>
                    `;
                });

                newHtml += `
                    <div class="border border-gray-800 p-6 rounded bg-[#111111] shadow-xl border-t-4 border-t-[#0033a0] flex flex-col">
                        <h2 class="text-lg font-montserrat font-bold text-[#c5a059] mb-4 uppercase tracking-widest">${cohortName}</h2>
                        
                        <div class="flex justify-between text-xs text-gray-500 mb-6 border-b border-gray-800 pb-4">
                            <span>Pending Nodes: <strong class="text-white">${info.nodes}</strong></span>
                            <span>Cohort Value: <strong class="text-[#00ff88]">P${info.expected_pulse.toLocaleString(undefined, {minimumFractionDigits: 2})}</strong></span>
                        </div>
                        
                        <div class="space-y-1 flex-grow overflow-y-auto max-h-[300px] pr-2">
                            ${membersHtml}
                        </div>
                    </div>
                `;
            }

            grid.innerHTML = newHtml;
        }

        // 3. Verification Action (Clears the mandate from the queue)
        function verifyMandate(mandateId) {
            const csrfToken = document.getElementById('csrf_token').value;
            
            // Build absolute path dynamically for PythonAnywhere
            const targetUrl = window.location.origin + "/hangar/api/verify_mandate/" + mandateId;

            fetch(targetUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                }
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    // Instantly reload to remove them from the queue visually
                    loadMatrixData(); 
                } else {
                    alert("Error clearing mandate: " + data.message);
                }
            })
            .catch(err => alert("Transmission Error. Check console."));
        }

        // 4. Export Utility
        function exportBatchCSV() {
            alert("System Notice: PDF Batch Generation initializing. (A.G. Pipeline connected)");
        }

        // START THE ENGINE
        // Poll the server every 3 seconds for new data
        setInterval(loadMatrixData, 3000);
        
        // Initial load immediately
        document.addEventListener('DOMContentLoaded', loadMatrixData);

    </script>
</body>
</html>
