{% extends "base.html" %}
{% block content %}
<style>
    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        width: 100%;
    }
    .staff-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 420px; text-align: center; border-top: 5px solid #003366; }
    .logo { width: 120px; margin-bottom: 20px; }
    h2 { color: #003366; font-size: 1.4rem; margin-bottom: 25px; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
    .form-group { text-align: left; margin-bottom: 20px; }
    .input-box { width: 100%; padding: 12px 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
    .input-box:focus { border-color: #003366; outline: none; }
    .btn-login { background: #003366; color: white; border: none; width: 100%; padding: 14px; font-size: 1rem; font-weight: 600; text-transform: uppercase; border-radius: 4px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn-login:hover { background: #002244; }
    .vault-link { display: block; margin-top: 25px; font-size: 0.8rem; color: #999; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; }
    .vault-link:hover { color: #c5a059; }
</style>

<div class="login-wrapper">
    <div class="staff-container">
        <img src="{{ url_for('static', filename='Laveto_logo-01.png') }}" class="logo" alt="LAVETO">
        <h2>Staff Online Portal</h2>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <input type="text" name="username" id="username" class="input-box" placeholder="Agent ID / Username" required>
            </div>

            <div class="form-group">
                <input type="password" name="password" id="password" class="input-box" placeholder="Passphrase" required>
            </div>

            <button type="submit" class="btn-login">ESTABLISH UPLINK</button>
        </form>

        <a href="{{ url_for('auth.warden_login') }}" class="vault-link">🔒 Secure Vault Uplink Portal</a>
    </div>
</div>
{% endblock %}
