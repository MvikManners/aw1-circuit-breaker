{% extends "base_minimal.html" %}

{% block content %}
<style>
    :root {
        --sanctified-blue: #003366;
        --integrity-gold: #C5A059;
        --critical-red: #ff4444;
        --vault-dark: #111111;
    }

    .navbar, .main-nav, .top-bar { display: none !important; }

    .vault-container {
        background: var(--vault-dark);
        border: 1px solid #333;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        border-radius: 4px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        margin: 50px auto;
    }

    .brand-logo { width: 140px; margin-bottom: 25px; display: block; margin-left: auto; margin-right: auto; }
    
    h2 {
        color: var(--integrity-gold);
        font-family: 'Montserrat', sans-serif;
        text-transform: uppercase;
        letter-spacing: 3px;
        font-size: 0.9rem;
        margin-bottom: 30px;
        font-weight: 900;
        text-align: center;
    }

    .input-group { margin-bottom: 20px; text-align: left; }
    label { display: block; color: #555; font-size: 0.7rem; text-transform: uppercase; font-weight: 900; margin-bottom: 8px; font-family: 'Courier Prime', monospace; }
    
    .input-field {
        background: #000; border: 1px solid var(--integrity-gold); color: #fff;
        width: 100%; padding: 15px; box-sizing: border-box;
        font-family: 'Courier Prime', monospace; font-size: 0.9rem; text-transform: uppercase;
    }

    .btn-action {
        background: var(--sanctified-blue); color: #fff; border: none;
        width: 100%; padding: 15px; font-family: 'Montserrat', sans-serif;
        font-weight: 900; cursor: pointer; transition: 0.3s; margin-top: 10px;
    }
    
    .btn-action:hover { background: #004488; }
    hr { border: 0; border-top: 1px solid #333; margin: 30px 0; }
</style>

<div class="vault-container">
    <img src="{{ url_for('static', filename='Laveto_logo-01.png') }}" class="brand-logo" alt="LAVETO">
    
    <h2>COMMAND WALL UPLINK</h2>
    <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="input-group"><label>IDENT_USER</label><input type="text" name="agent_id" class="input-field" required></div>
        <div class="input-group"><label>ACCESS_CIPHER</label><input type="password" name="password" class="input-field" required></div>
        <button type="submit" class="btn-action">ESTABLISH UPLINK</button>
    </form>

    <hr>

    <h2>SOVEREIGN ACCESS TERMINAL</h2>
    <form action="{{ url_for('hangar.client_login') }}" method="POST">
        <div class="input-group"><label>ASSET VIN / DNA</label><input type="text" name="vin_dna" class="input-field" required></div>
        <div class="input-group"><label>ACCESS PIN</label><input type="password" name="client_pin" class="input-field" required></div>
        <button type="submit" class="btn-action">INITIATE HANDSHAKE</button>
    </form>
</div>
{% endblock %}
