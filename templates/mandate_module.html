<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini API Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">

    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-lg">
        <h1 class="text-2xl font-bold mb-6 text-indigo-400">Gemini Request</h1>
        
        <div class="space-y-4">
            <textarea 
                id="prompt-input" 
                rows="4"
                placeholder="Enter your prompt here..." 
                class="w-full bg-slate-950 border border-slate-800 rounded-lg p-4 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            ></textarea>
            
            <button 
                id="submit-btn"
                onclick="sendRequest()" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition-all"
            >
                Generate Content
            </button>
        </div>

        <div id="output-container" class="mt-8 hidden">
            <h2 class="text-sm font-semibold text-slate-400 mb-2">Response:</h2>
            <div id="response-box" class="bg-slate-950 border border-slate-800 p-4 rounded-lg text-slate-300 min-h-[100px] whitespace-pre-wrap"></div>
        </div>
    </div>

    <script>
        // Note: The API key is provided at runtime in this environment.
        const API_KEY = ""; 
        const MODEL = "gemini-2.5-flash-preview-09-2025"; 

        async function sendRequest() {
            const prompt = document.getElementById('prompt-input').value;
            const outputContainer = document.getElementById('output-container');
            const responseBox = document.getElementById('response-box');
            const submitBtn = document.getElementById('submit-btn');

            if (!prompt) return;

            submitBtn.disabled = true;
            submitBtn.textContent = "Generating...";
            outputContainer.classList.remove('hidden');
            responseBox.textContent = "Connecting to Gemini...";

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    responseBox.textContent = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    responseBox.textContent = "API Error: " + data.error.message;
                } else {
                    responseBox.textContent = "Error: Unexpected response format.";
                    console.error(data);
                }
            } catch (err) {
                responseBox.textContent = "Error: " + err.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Generate Content";
            }
        }
    </script>
</body>
</html>
