<div class="intake-zone">
    <div class="zone-label">Asset DNA Classification</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
        <div class="form-group" style="margin-bottom: 0;">
            <label for="vehicle_make_input">1. MAKE</label>
            <select id="vehicle_make_input" name="vehicle_make" required onchange="handleMakeChange()">
                <option value="">-- SELECT MAKE --</option>
                <option value="TOYOTA">TOYOTA</option>
                <option value="BMW">BMW</option>
                </select>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
            <label for="vehicle_model_input">2. MODEL</label>
            <select id="vehicle_model_input" name="vehicle_model" required disabled onchange="handleModelChange()">
                <option value="">-- SELECT MODEL --</option>
            </select>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
            <label for="vehicle_year_input">3. YEAR</label>
            <select id="vehicle_year_input" name="vehicle_year" required disabled onchange="handleYearChange()">
                <option value="">-- SELECT YEAR --</option>
            </select>
        </div>
    </div>
    <input type="hidden" name="vehicle_class" id="classSelect" value="">
</div>
